{% extends "base_auth.html" %}
{% block content %}
<div class="card hover-animate shadow">
    <div class="card-header bg-success text-white">
        <h4 class="mb-0 text-white">Create Account</h4>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="">
            <div class="mb-3">
                <label class="form-label text-white">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Email address</label>
                <input type="email" class="form-control" name="email" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Enter password" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Account Role</label>
                <select class="form-select form-control" name="role" required>
                    <option value="admin">Administrator</option>
                    <option value="analyst">Security Analyst</option>
                    <option value="user">User / Viewer</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Sign Up</button>
        </form>
        <div class="mt-3 text-center">
            <small class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log In</a></small>
        </div>
    </div>
</div>
{% endblock %}
