{% extends "base.html" %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h2 class="display-6"><i class="bi bi-people-fill"></i> User Management</h2>
        <p class="text-muted">Manage system administrators and standard users.</p>
    </div>
</div>

<div class="card hover-animate shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.id }}</td>
                        <td><strong>{{ user.username }}</strong></td>
                        <td>{{ user.email }}</td>
                        <td>
                            <select class="form-select form-select-sm w-auto" onchange="changeRole({{ user.id }}, this.value)" {% if user.id == current_user.id %}disabled{% endif %}>
                                <option value="user" {% if user.role == 'user' %}selected{% endif %}>Standard User</option>
                                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                            </select>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser({{ user.id }})" {% if user.id == current_user.id %}disabled{% endif %}>
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function deleteUser(id) {
    if (!confirm("Are you sure you want to delete this user?")) return;
    
    try {
        const response = await fetch(`/admin/delete_user/${id}`, { method: 'POST' });
        const data = await response.json();
        if (data.status === 'success') {
            location.reload();
        } else {
            alert(data.message);
        }
    } catch (error) {
        alert("Failed to delete user");
    }
}

async function changeRole(id, newRole) {
    try {
        const response = await fetch(`/admin/change_role/${id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: newRole })
        });
        const data = await response.json();
        if (data.status !== 'success') {
            alert(data.message);
            location.reload();
        }
    } catch (error) {
        alert("Failed to change role");
        location.reload();
    }
}
</script>
{% endblock %}
