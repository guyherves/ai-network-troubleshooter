<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NetOps - {{ title }}</title>
    <meta name="description" content="AI-Based Network Monitoring and Intrusion Detection System">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('noc_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #0F172A, #1E1B4B, #0B1120, #0F172A);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Abstract glowing orbs behind the card */
        .auth-wrapper::before, .auth-wrapper::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }
        
        .auth-wrapper::before {
            background: var(--primary);
            top: 20%;
            left: 30%;
        }
        
        .auth-wrapper::after {
            background: #7C3AED;
            bottom: 20%;
            right: 30%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, -50px); }
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
        }

        /* Glassmorphism Card Override */
        .auth-container .card {
            background: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            border-radius: 16px !important;
        }
        
        .auth-container .card-header {
            background: transparent !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 20px !important;
            text-align: center;
        }

        .auth-container .form-control {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
        }
        
        .auth-container .form-control:focus {
            background: rgba(15, 23, 42, 0.8) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25) !important;
        }

        .auth-container .btn-primary {
            background: linear-gradient(135deg, var(--primary), #7C3AED);
            border: none;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-container .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }
        
        .auth-container .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            border: none;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .auth-container .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--success);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <!-- Brand Logo for Auth Pages -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center" style="width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), #7C3AED); border-radius: 12px; font-size: 24px; color: white; margin-bottom: 10px;">
                    🛡
                </div>
                <h3 class="mb-0 text-white" style="font-weight: 700;">AI NetOps</h3>
                <p class="text-muted small">Network Operations Center</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="background: var(--bg-card); border-color: var(--border-color); color: var(--text-main);">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
