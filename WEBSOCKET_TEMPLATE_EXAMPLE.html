<!-- WebSocket Dashboard Integration Example -->
<!-- This example shows how to integrate WebSocket real-time updates into the dashboard -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network IDS Dashboard - Real-time</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .connection-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .connection-indicator.connected {
            background-color: #28a745;
            animation: pulse 2s infinite;
        }
        
        .connection-indicator.disconnected {
            background-color: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        #status-bar {
            padding: 8px 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .alert-item {
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .alert-item.high {
            border-left-color: #dc3545;
            background-color: #f8d7da;
        }
        
        .alert-item.medium {
            border-left-color: #ffc107;
            background-color: #fff3cd;
        }
        
        .alert-item.low {
            border-left-color: #17a2b8;
            background-color: #d1ecf1;
        }
        
        .last-update {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<!-- Connection Status Bar -->
<div id="status-bar">
    <div>
        <span class="connection-indicator connected"></span>
        <span id="connection-status">Live</span>
    </div>
    <div class="last-update">Last updated: <span id="last-update">--:--:--</span></div>
</div>

<!-- Dashboard Content -->
<div class="container">
    <!-- Statistics Section -->
    <div class="row">
        <div class="col-md-3">
            <div class="stat-card">
                <h5>System Uptime</h5>
                <p class="stat-value" id="uptime-stat">99.99%</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h5>Active Threats</h5>
                <p class="stat-value" id="threats-stat">0</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h5>Devices Online</h5>
                <p class="stat-value" id="devices-stat">--</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <h5>Alerts Today</h5>
                <p class="stat-value" id="alerts-today">0</p>
            </div>
        </div>
    </div>
    
    <!-- Real-time Alerts Section -->
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Real-time Alerts</h5>
                </div>
                <div class="card-body" id="alerts-container">
                    <p class="text-muted">No alerts yet...</p>
                </div>
            </div>
        </div>
        
        <!-- Real-time IDS Events Section -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Latest IDS Events</h5>
                </div>
                <div class="card-body" id="ids-events-container">
                    <p class="text-muted">No events yet...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Network Devices Section -->
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5>Network Devices Status</h5>
                </div>
                <div class="card-body">
                    <table class="table table-sm" id="devices-table">
                        <thead>
                            <tr>
                                <th>IP Address</th>
                                <th>Status</th>
                                <th>Latency</th>
                                <th>Packet Loss</th>
                            </tr>
                        </thead>
                        <tbody id="devices-table-body">
                            <!-- Populated by WebSocket -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Include Socket.io Library -->
<script src="/socket.io/socket.io.js"></script>

<!-- Include WebSocket Client Library -->
<script src="/static/js/websocket-client.js"></script>

<!-- Dashboard Real-time Updates Script -->
<script>
/**
 * Dashboard Real-time Updates
 * Integrates WebSocket for live data
 */

let ws;

/**
 * Initialize WebSocket and set up event handlers
 */
function initDashboard() {
    // Create WebSocket client
    ws = new NetworkIDSWebSocket();
    
    // Handle connection
    ws.on('connected', () => {
        console.log('Connected to server');
        updateConnectionStatus(true);
        ws.joinRoom('dashboard');
        ws.requestDashboardUpdate();
    });
    
    // Handle disconnection
    ws.on('disconnected', () => {
        console.log('Disconnected from server');
        updateConnectionStatus(false);
    });
    
    // Handle dashboard updates
    ws.on('dashboard_update', (data) => {
        console.log('Dashboard update:', data);
        updateDashboardStats(data);
    });
    
    // Handle dashboard stats
    ws.on('dashboard_stats', (data) => {
        console.log('Dashboard stats:', data);
        updateCharts(data);
    });
    
    // Handle new alerts
    ws.on('new_alert', (alert) => {
        console.log('New alert:', alert);
        addAlertToUI(alert);
        incrementAlertCount();
        showNotification('Alert', alert.message);
    });
    
    // Handle IDS events
    ws.on('new_ids_event', (event) => {
        console.log('New IDS event:', event);
        addIDSEventToUI(event);
        showNotification('IDS Event', event.event);
    });
    
    // Handle network updates
    ws.on('network_update', (data) => {
        console.log('Network update:', data);
        updateDeviceRow(data);
    });
    
    // Handle requests
    ws.on('alerts_data', (data) => {
        console.log('Alerts data:', data);
        if (data.alerts && data.alerts.length > 0) {
            data.alerts.forEach(alert => addAlertToUI(alert));
        }
    });
    
    ws.on('ids_events', (data) => {
        console.log('IDS events:', data);
        if (data.events && data.events.length > 0) {
            data.events.forEach(event => addIDSEventToUI(event));
        }
    });
    
    // Handle errors
    ws.on('ws_error', (error) => {
        console.error('WebSocket error:', error);
        updateConnectionStatus(false);
    });
}

/**
 * Update connection status indicator
 */
function updateConnectionStatus(connected) {
    const indicator = document.querySelector('.connection-indicator');
    const status = document.getElementById('connection-status');
    
    if (connected) {
        indicator.classList.remove('disconnected');
        indicator.classList.add('connected');
        status.textContent = 'Live';
    } else {
        indicator.classList.remove('connected');
        indicator.classList.add('disconnected');
        status.textContent = 'Offline';
    }
}

/**
 * Update dashboard statistics
 */
function updateDashboardStats(data) {
    if (data.uptime !== undefined) {
        document.getElementById('uptime-stat').textContent = data.uptime + '%';
    }
    
    if (data.threats !== undefined) {
        document.getElementById('threats-stat').textContent = data.threats;
    }
    
    if (data.timestamp) {
        const time = new Date(data.timestamp).toLocaleTimeString();
        document.getElementById('last-update').textContent = time;
    }
}

/**
 * Add alert to UI
 */
function addAlertToUI(alert) {
    const container = document.getElementById('alerts-container');
    
    // Remove placeholder if present
    const placeholder = container.querySelector('.text-muted');
    if (placeholder) {
        placeholder.remove();
    }
    
    // Create alert element
    const alertEl = document.createElement('div');
    alertEl.className = `alert-item ${alert.severity.toLowerCase()}`;
    alertEl.innerHTML = `
        <strong>${alert.severity}:</strong> ${alert.message}
        <div class="last-update">${new Date(alert.timestamp).toLocaleTimeString()}</div>
    `;
    
    // Add to top
    container.insertBefore(alertEl, container.firstChild);
    
    // Keep only last 5 alerts
    const alerts = container.querySelectorAll('.alert-item');
    while (alerts.length > 5) {
        container.removeChild(container.lastChild);
    }
}

/**
 * Add IDS event to UI
 */
function addIDSEventToUI(event) {
    const container = document.getElementById('ids-events-container');
    
    // Remove placeholder if present
    const placeholder = container.querySelector('.text-muted');
    if (placeholder) {
        placeholder.remove();
    }
    
    // Create event element
    const eventEl = document.createElement('div');
    eventEl.className = `alert-item ${event.severity.toLowerCase()}`;
    eventEl.innerHTML = `
        <strong>${event.event}:</strong> ${event.src_ip}:${event.port}
        <div class="last-update">Action: ${event.action} | ${new Date(event.timestamp).toLocaleTimeString()}</div>
    `;
    
    // Add to top
    container.insertBefore(eventEl, container.firstChild);
    
    // Keep only last 5 events
    const events = container.querySelectorAll('.alert-item');
    while (events.length > 5) {
        container.removeChild(container.lastChild);
    }
}

/**
 * Update device row in table
 */
function updateDeviceRow(data) {
    const tbody = document.getElementById('devices-table-body');
    let row = document.getElementById(`device-${data.target_ip}`);
    
    if (!row) {
        row = document.createElement('tr');
        row.id = `device-${data.target_ip}`;
        tbody.appendChild(row);
    }
    
    row.innerHTML = `
        <td>${data.target_ip}</td>
        <td>
            <span class="badge" style="background-color: ${data.status === 'Online' ? '#28a745' : '#dc3545'}">
                ${data.status}
            </span>
        </td>
        <td>${data.latency}ms</td>
        <td>${data.packet_loss}%</td>
    `;
}

/**
 * Increment alert count
 */
function incrementAlertCount() {
    const counter = document.getElementById('alerts-today');
    const count = parseInt(counter.textContent) || 0;
    counter.textContent = count + 1;
}

/**
 * Update charts (placeholder)
 */
function updateCharts(data) {
    // Implement with Chart.js or similar
    console.log('Update charts with:', data);
}

/**
 * Show browser notification
 */
function showNotification(title, message) {
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
            body: message,
            icon: '/static/img/icon.png'
        });
    }
}

/**
 * Request notification permission
 */
function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
}

// Initialize when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
    requestNotificationPermission();
    initDashboard();
    
    // Periodically request updates (fallback if WebSocket events don't arrive)
    setInterval(() => {
        if (ws && ws.isConnected()) {
            ws.requestDashboardUpdate();
        }
    }, 10000); // Every 10 seconds
});

// Clean up on page unload
window.addEventListener('beforeunload', function() {
    if (ws) {
        ws.close();
    }
});
</script>

</body>
</html>
